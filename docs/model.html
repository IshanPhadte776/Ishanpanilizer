<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model viewer</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #f5f7f9; font: 13px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 14px;
        background: rgba(255,255,255,0.88); border: 1px solid #d4dae2; border-radius: 6px;
        color: #1f2933; max-width: 320px;
      }
      #hud b { display: block; margin-bottom: 4px; }
      #hud span { color: #52606d; }
      #hud-stats {
        margin-top: 6px; padding-top: 6px; border-top: 1px solid #e1e7ed; color: #52606d;
      }
      #hud-stats strong { color: #1f2933; }
    </style>
  </head>
  <body>
    <div id="hud">
      <b id="hud-title">Loading…</b>
      <span id="hud-sub"></span>
      <div id="hud-stats"></div>
    </div>
    <canvas id="scene"></canvas>
    <script type="module" src="model_viewer.js"></script>
  </body>
</html>
